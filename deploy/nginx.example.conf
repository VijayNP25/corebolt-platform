# Example reverse proxy for AWS EC2 (COREBOLT)
# Place under /etc/nginx/sites-available/corebolt

upstream corebolt_web {
  server 127.0.0.1:3000;
}

upstream corebolt_api {
  server 127.0.0.1:4000;
}

server {
  listen 80;
  server_name www.core-bolt.com core-bolt.com;

  # Redirect to HTTPS in production after certbot
  # return 301 https://www.core-bolt.com$request_uri;

  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://corebolt_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://corebolt_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
