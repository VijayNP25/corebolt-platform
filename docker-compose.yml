services:
  postgres:
    image: postgres:16-alpine
    container_name: corebolt-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: corebolt
      POSTGRES_PASSWORD: corebolt
      POSTGRES_DB: corebolt
    volumes:
      - corebolt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U corebolt -d corebolt']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corebolt_pgdata:
